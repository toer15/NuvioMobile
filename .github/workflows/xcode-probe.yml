name: Xcode Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-latest
    steps:
      - name: List toolchains
        run: |
          sw_vers
          echo "--- default ---"
          xcodebuild -version
          echo "--- installed Xcodes ---"
          ls -1 /Applications | grep -i '^Xcode' || true
